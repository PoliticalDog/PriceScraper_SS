{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}PriceScraper — Dashboard{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.datatables.net/1.13.11/css/dataTables.bootstrap5.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" rel="stylesheet">
  <link href="{% static 'dashboard/dashboard.css' %}" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top mb-3">
    <div class="container-fluid">
      <a class="navbar-brand" href="/">PriceScraper</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="nav">
        <ul class="navbar-nav">
          <li class="nav-item"><a class="nav-link{% if activo == 'resumen' %} active{% endif %}" href="/"><i class="ti ti-dashboard"></i> Resumen</a></li>
          <li class="nav-item"><a class="nav-link{% if activo == 'precios' %} active{% endif %}" href="/precios"><i class="ti ti-tag"></i> Precios actuales</a></li>
          <li class="nav-item"><a class="nav-link{% if activo == 'comparativa' %} active{% endif %}" href="/comparativa"><i class="ti ti-arrows-left-right"></i> Comparativa</a></li>
          <li class="nav-item"><a class="nav-link{% if activo == 'historico' %} active{% endif %}" href="/historico"><i class="ti ti-history"></i> Histórico</a></li>
          <li class="nav-item"><a class="nav-link{% if activo == 'calidad' %} active{% endif %}" href="/calidad"><i class="ti ti-shield-check"></i> Calidad</a></li>
          <li class="nav-item"><a class="nav-link{% if activo == 'promociones' %} active{% endif %}" href="/promociones"><i class="ti ti-discount-2"></i> Promociones</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="container-fluid px-4 pb-5">
    {% block contenido %}{% endblock %}
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.11/js/jquery.dataTables.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.11/js/dataTables.bootstrap5.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <script src="{% static 'dashboard/dashboard.js' %}"></script>
  {% block script %}{% endblock %}
</body>
</html>
