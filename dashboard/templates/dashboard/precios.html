{% extends "dashboard/base.html" %}
{% block titulo %}Precios actuales — PriceScraper{% endblock %}

{% block contenido %}
<h4 class="mb-3">Precios actuales</h4>

<div class="filtros-card">
  <div class="row g-2 align-items-end">
    <div class="col-md-3">
      <label class="form-label">Tienda</label>
      <select id="fTienda" class="form-select" multiple size="4"></select>
    </div>
    <div class="col-md-3">
      <label class="form-label">Categoría</label>
      <select id="fCategoria" class="form-select" multiple size="4"></select>
    </div>
    <div class="col-md-2">
      <label class="form-label">Vigente desde</label>
      <input type="date" id="fDesde" class="form-control">
    </div>
    <div class="col-md-2">
      <label class="form-label">Vigente hasta</label>
      <input type="date" id="fHasta" class="form-control">
    </div>
    <div class="col-md-2">
      <label class="form-label">Producto</label>
      <input type="text" id="fBusqueda" class="form-control" placeholder="Buscar...">
    </div>
  </div>
  <div class="row g-2 align-items-center mt-2">
    <div class="col-auto form-check ms-1">
      <input class="form-check-input" type="checkbox" id="fSoloDescuento">
      <label class="form-check-label" for="fSoloDescuento">Solo con descuento</label>
    </div>
    <div class="col-auto">
      <button class="btn btn-primary" id="btnAplicar">Aplicar filtros</button>
    </div>
  </div>
</div>

<table id="tablaPrecios" class="table table-striped table-hover w-100"></table>
{% endblock %}

{% block script %}
<script>
async function cargarFiltros() {
  const tiendas = await fetchJSON("/api/filtros/tiendas");
  const categorias = await fetchJSON("/api/filtros/categorias");
  document.getElementById("fTienda").innerHTML =
    tiendas.map((t) => `<option value="${t.nombre}">${t.nombre}</option>`).join("");
  document.getElementById("fCategoria").innerHTML =
    categorias.map((c) => `<option value="${c}">${c}</option>`).join("");
}

async function cargarTabla() {
  const params = {
    tienda: valoresSeleccionados(document.getElementById("fTienda")),
    categoria: valoresSeleccionados(document.getElementById("fCategoria")),
    desde: document.getElementById("fDesde").value,
    hasta: document.getElementById("fHasta").value,
    q: document.getElementById("fBusqueda").value,
    solo_descuento: document.getElementById("fSoloDescuento").checked,
  };
  const datos = await fetchJSON(`/api/precios${qs(params)}`);

  renderTabla("#tablaPrecios", datos, [
    { data: "tienda", title: "Tienda" },
    { data: "producto", title: "Producto" },
    { data: "categoria", title: "Categoría" },
    { data: "precio_actual", title: "Precio actual", render: (d) => formatoMoneda(d) },
    { data: "precio_anterior", title: "Precio anterior", render: (d) => formatoMoneda(d) },
    { data: "descuento_pct", title: "Descuento", render: (d) => formatoPct(d) },
    { data: "vigencia_desde", title: "Desde" },
    { data: "vigencia_hasta", title: "Hasta" },
  ], { order: [[5, "desc"]] });
}

document.getElementById("btnAplicar").addEventListener("click", cargarTabla);
cargarFiltros().then(cargarTabla);
</script>
{% endblock %}
