{% extends "dashboard/base.html" %}
{% block titulo %}Calidad del pipeline — PriceScraper{% endblock %}

{% block contenido %}
<h4 class="mb-3">Calidad del pipeline OCR+NLP</h4>
<p class="text-muted">Uso operativo: detectar folletos con baja tasa útil o confianza OCR baja.</p>

<div class="filtros-card">
  <div class="row g-2 align-items-end">
    <div class="col-md-3">
      <label class="form-label">Tienda</label>
      <select id="fTienda" class="form-select" multiple size="4"></select>
    </div>
    <div class="col-md-2">
      <label class="form-label">Fuente</label>
      <select id="fFuente" class="form-select">
        <option value="">Todas</option>
        <option value="tiendeo">tiendeo</option>
        <option value="ofertomat">ofertomat</option>
      </select>
    </div>
    <div class="col-md-2">
      <label class="form-label">Estado</label>
      <select id="fEstado" class="form-select">
        <option value="">Todos</option>
        <option value="pending">pending</option>
        <option value="processing">processing</option>
        <option value="done">done</option>
        <option value="error">error</option>
      </select>
    </div>
    <div class="col-md-3">
      <label class="form-label">Tasa útil mínima (0–1)</label>
      <input type="number" id="fTasaMin" class="form-control" step="0.05" min="0" max="1" placeholder="ej. 0.3">
    </div>
    <div class="col-md-2">
      <button class="btn btn-primary w-100" id="btnAplicar">Aplicar</button>
    </div>
  </div>
</div>

<table id="tablaCalidad" class="table table-striped table-hover w-100"></table>
{% endblock %}

{% block script %}
<script>
async function cargarFiltros() {
  const tiendas = await fetchJSON("/api/filtros/tiendas");
  document.getElementById("fTienda").innerHTML =
    tiendas.map((t) => `<option value="${t.nombre}">${t.nombre}</option>`).join("");
}

async function cargarTabla() {
  const params = {
    tienda: valoresSeleccionados(document.getElementById("fTienda")),
    fuente: document.getElementById("fFuente").value,
    estado: document.getElementById("fEstado").value,
    tasa_util_min: document.getElementById("fTasaMin").value,
  };
  const datos = await fetchJSON(`/api/calidad${qs(params)}`);

  renderTabla("#tablaCalidad", datos, [
    { data: "tienda", title: "Tienda" },
    { data: "folleto_id_fuente", title: "Folleto" },
    { data: "fuente", title: "Fuente" },
    { data: "fecha_inicio", title: "Fecha" },
    { data: "paginas_procesadas", title: "Págs. proc." },
    { data: "total_paginas", title: "Págs. total" },
    { data: "confianza_ocr_prom", title: "Confianza OCR" },
    { data: "tasa_util_prom", title: "Tasa útil" },
    {
      data: "estado", title: "Estado",
      render: (estado, tipo, fila) => {
        if (tipo !== "display") return estado;
        const tasa = fila.tasa_util_prom;
        // El color de fondo de la fila (fila-critica/fila-alerta) nunca va
        // solo -- siempre acompañado de icono + texto (regla de la skill
        // dataviz: "status colors... always paired with an icon + label").
        if (tasa !== null && tasa !== undefined && tasa < 0.2) {
          return `<i class="ti ti-alert-triangle text-danger"></i> ${estado}`;
        }
        if (tasa !== null && tasa !== undefined && tasa < 0.4) {
          return `<i class="ti ti-alert-circle text-warning"></i> ${estado}`;
        }
        return estado;
      },
    },
  ], {
    order: [[7, "asc"]],
    rowCallback: function (row, data) {
      const tasa = data.tasa_util_prom;
      if (tasa !== null && tasa !== undefined) {
        if (tasa < 0.2) $(row).addClass("fila-critica");
        else if (tasa < 0.4) $(row).addClass("fila-alerta");
      }
    },
  });
}

document.getElementById("btnAplicar").addEventListener("click", cargarTabla);
cargarFiltros().then(cargarTabla);
</script>
{% endblock %}
